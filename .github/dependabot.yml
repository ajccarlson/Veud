version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: America/Los_Angeles
    open-pull-requests-limit: 10
    assignees:
      - ajccarlson
    commit-message:
      prefix: deps
      prefix-development: deps-dev
      include: scope
    groups:
      production-minor-and-patch:
        dependency-type: production
        update-types:
          - minor
          - patch
      development-minor-and-patch:
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: '/'
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: '09:30'
      timezone: America/Los_Angeles
    open-pull-requests-limit: 5
    assignees:
      - ajccarlson
    commit-message:
      prefix: ci
      include: scope
    groups:
      github-actions:
        patterns:
          - '*'
