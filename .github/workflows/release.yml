name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:16.14-alpine@sha256:7a396fd264a2067788b6551122b50f162bf6136312c7fc9d74381cb92c648382
        env:
          POSTGRES_DB: veud_release_test
          POSTGRES_PASSWORD: veud
          POSTGRES_USER: veud
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U veud -d veud_release_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require release ancestry from main
        run: |
          if ! git branch --remotes --contains "$GITHUB_SHA" | grep -qE 'origin/main$'; then
            echo "Release tags must point to a commit reachable from main." >&2
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Create test environment
        run: cp .env.example .env

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run application release gates
        run: npm run validate:release:hosted

      - name: Run PostgreSQL release gates
        run: npm run validate:release:postgres
        env:
          DATABASE_URL: postgresql://veud:veud@localhost:5432/veud_release_test

  publish:
    name: Publish attested release
    needs: verify
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    environment: release
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Build source release and SBOM
        run: |
          tag="${GITHUB_REF_NAME}"
          mkdir -p release-assets
          git archive --format=tar --prefix="veud-${tag}/" "$GITHUB_SHA" |
            gzip -n > "release-assets/veud-${tag}-source.tar.gz"
          npm sbom --sbom-format=cyclonedx > "release-assets/veud-${tag}-sbom.cdx.json"
          (
            cd release-assets
            sha256sum "veud-${tag}-source.tar.gz" "veud-${tag}-sbom.cdx.json" > SHA256SUMS
          )

      - name: Attest build provenance
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: release-assets/veud-${{ github.ref_name }}-source.tar.gz

      - name: Attest software bill of materials
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: release-assets/veud-${{ github.ref_name }}-source.tar.gz
          sbom-path: release-assets/veud-${{ github.ref_name }}-sbom.cdx.json

      - name: Upload release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ github.ref_name }}
          path: release-assets/
          retention-days: 90

      - name: Create GitHub release
        run: >-
          gh release create "$GITHUB_REF_NAME" release-assets/* --generate-notes
          --title "Veud $GITHUB_REF_NAME" --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
