name: Bug report
description: Report reproducible incorrect behavior.
title: '[Bug]: '
labels:
  - bug
body:
  - type: markdown
    attributes:
      value:
        Do not include passwords, API keys, private profile data, or security
        vulnerabilities.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      placeholder: |
        1. Go to…
        2. Select…
        3. Observe…
    validations:
      required: true
  - type: input
    id: page
    attributes:
      label: Page or feature
      placeholder: Watchlist, profile, discover, TOMT…
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and device
      placeholder: Firefox 128 on desktop, Safari on iPhone…
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or logs
      description: Redact personal information and secrets.
